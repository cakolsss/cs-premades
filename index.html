<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Squad — Reservas</title>
<style>
  :root {
    --bg: #14161a;
    --bg-elev: #1d2026;
    --fg: #eef0f3;
    --muted: #9aa0ab;
    --border: #30343c;
    --accent: #ff8a3d;
    --accent-fg: #1a1200;
    --accent-soft: #3a2712;
    --danger: #ff6b6b;
    --success: #3ad672;
    --success-soft: #123a22;
    --slotA: #6ea8ff;
    --slotB: #ff8080;
    --chip-bg: #262a31;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7;
    --bg-elev: #ffffff;
    --fg: #1b1e24;
    --muted: #6b7280;
    --border: #e2e4e9;
    --accent: #f5761a;
    --accent-fg: #ffffff;
    --accent-soft: #fef1e6;
    --danger: #d64545;
    --success: #1f9d52;
    --success-soft: #e6f8ed;
    --slotA: #3a7bd5;
    --slotB: #d5473a;
    --chip-bg: #eef0f3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); padding: 66px 14px 60px; line-height: 1.4; transition: background .25s, color .25s; }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; position: relative; animation: fadeInUp .5s ease both; padding: 0 78px; }
  @media (max-width: 480px) { header { padding: 0; margin-top: 46px; } }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: 0.95rem; }
  #theme-toggle {
    position: fixed; top: 12px; left: 12px; z-index: 500;
    background: var(--chip-bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 999px; width: 38px; height: 38px; padding: 0; font-size: 1.1rem;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }
  #banner { display: none; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--fg); padding: 10px 14px; border-radius: 14px; margin-bottom: 16px; font-size: 0.9rem; }
  .card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; animation: fadeInUp .5s ease both; }
  .card:nth-of-type(2) { animation-delay: .05s; }
  .card:nth-of-type(3) { animation-delay: .1s; }
  .card h2 { margin: 0 0 14px; font-size: 1.05rem; }
  .collapsible-header {
    width: 100%; background: none; border: none; padding: 0; margin: 0 0 0; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; color: var(--fg);
  }
  #create-chevron { transition: transform .25s; color: var(--muted); font-size: 1.1rem; }
  #create-chevron.open { transform: rotate(180deg); }
  .collapsible-body { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .collapsible-body.open { max-height: 500px; margin-top: 14px; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }
  input, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.95rem; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }
  button { cursor: pointer; border: none; border-radius: 10px; padding: 10px 16px; font-size: 0.9rem; font-weight: 600; background: var(--accent); color: var(--accent-fg); transition: transform .1s; }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.small { padding: 5px 10px; font-size: 0.78rem; }
  button.full { width: 100%; margin-top: 16px; }
  button.subtle { background: var(--chip-bg); color: var(--fg); }
  #sessions-list { display: flex; flex-direction: column; gap: 14px; }
  .empty-msg { color: var(--muted); text-align: center; padding: 20px 0; font-size: 0.9rem; }
  .session-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 14px; padding: 16px; animation: fadeInUp .4s ease both; transition: box-shadow .3s, border-color .3s; }
  .session-card.just-completed { animation: fadeInUp .4s ease both, celebrate 1.1s ease; border-color: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
  .session-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .session-when { font-weight: 700; font-size: 1rem; }
  .session-when .rel { color: var(--accent); font-weight: 600; font-size: 0.8rem; margin-left: 6px; }
  .badge { display: inline-block; background: var(--chip-bg); color: var(--fg); border-radius: 999px; padding: 3px 10px; font-size: 0.75rem; font-weight: 600; margin-top: 4px; animation: chipPop .35s ease; }
  .capacity { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .teams { display: flex; gap: 12px; }
  .teams > div { flex: 1; min-width: 0; }
  .team-label { font-size: 0.78rem; font-weight: 700; margin-bottom: 6px; }
  .team-label.a { color: var(--slotA); }
  .team-label.b { color: var(--slotB); }
  .players { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { background: var(--chip-bg); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 0.82rem; display: flex; align-items: center; gap: 6px; animation: chipPop .28s ease; }
  .chip button { background: transparent; color: var(--muted); padding: 0 4px; font-size: 0.9rem; font-weight: 700; border-radius: 50%; line-height: 1; }
  .chip button:hover { color: var(--danger); }
  .slot-empty { border: 1px dashed var(--border); border-radius: 999px; padding: 4px 12px; font-size: 0.82rem; color: var(--muted); }
  .join-row { display: flex; gap: 8px; margin-top: 8px; }
  .waitlist-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .waitlist-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  .session-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .creator-note { font-size: 0.75rem; color: var(--muted); }
  .full-tag { color: var(--danger); font-weight: 700; }
  .summary-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: -8px 0 18px; animation: fadeInUp .5s ease both; animation-delay: .15s; }
  .pill { background: var(--chip-bg); border-radius: 999px; padding: 6px 12px; font-size: 0.78rem; font-weight: 600; }
  .pill.pill-accent { background: var(--accent-soft); color: var(--accent); }
  #radio-player {
    position: fixed; right: 12px; top: 12px; z-index: 500;
    display: flex; align-items: center; gap: 5px;
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 8px; box-shadow: 0 4px 12px rgba(0,0,0,.2);
    max-width: calc(100vw - 24px);
  }
  #radio-toggle { width: 26px; height: 26px; border-radius: 50%; padding: 0; font-size: 0.75rem; flex-shrink: 0; }
  #radio-info { display: none; }
  .radio-mini { background: var(--chip-bg); color: var(--fg); width: 20px; height: 20px; border-radius: 50%; padding: 0; font-size: 0.55rem; flex-shrink: 0; }
  #radio-vol { width: 40px; accent-color: var(--accent); flex-shrink: 0; }
  input[type="range"] { -webkit-appearance: none; appearance: none; padding: 0; border: none; background: transparent; height: 20px; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--border); border-radius: 999px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  input[type="range"]::-moz-range-track { height: 4px; background: var(--border); border-radius: 999px; }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--accent); cursor: pointer; }
  @media (max-width: 480px) {
    #radio-player { padding: 4px 6px; }
  }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes chipPop { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes celebrate { 0% { transform: scale(1); } 20% { transform: scale(1.015); } 40% { transform: scale(0.995); } 60% { transform: scale(1.01); } 100% { transform: scale(1); } }

  .wrap { opacity: 0; }
  .wrap.reveal { animation: fadeInUp .5s ease forwards; }

  #intro-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: radial-gradient(circle at 50% 40%, var(--bg-elev), var(--bg) 75%);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    transition: opacity .45s ease, visibility .45s ease;
  }
  #intro-overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #intro-icon { font-size: 3.4rem; animation: introBounce 1s ease infinite; margin-bottom: 6px; }
  #sherry-wrap { opacity: 0; animation: fadeInUp .5s ease forwards; animation-delay: 1.1s; }
  #sherry-dog { margin-top: 18px; cursor: pointer; animation: sherryIdle 2.4s ease-in-out infinite; }
  #sherry-dog.sherry-happy { animation: sherryWiggle .6s ease 2; }
  #sherry-dog.mood-excited #sherry-tail { animation: tailWagFast .25s ease-in-out infinite; transform-origin: 150px 140px; }
  #sherry-dog.mood-sleepy { animation-duration: 4.5s !important; }
  #sherry-dog.mood-sleepy #sherry-lid-l, #sherry-dog.mood-sleepy #sherry-lid-r { opacity: 1; }
  #sherry-dog.mood-awake #sherry-lid-l, #sherry-dog.mood-awake #sherry-lid-r { opacity: 0; transition: opacity .4s; }
  #sherry-zzz { position: absolute; top: -6px; right: 6px; font-size: 1.4rem; opacity: 0; }
  #sherry-dog.mood-sleepy ~ #sherry-zzz { opacity: 1; animation: zzzFloat 2.2s ease-in-out infinite; }
  #sherry-particles { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .sherry-particle { position: absolute; font-size: 1.2rem; left: 50%; top: 40%; opacity: 0; animation: particleFloat 0.9s ease-out forwards; }
  @keyframes tailWagFast { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
  @keyframes zzzFloat { 0% { transform: translateY(0) scale(0.8); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-18px) scale(1.1); opacity: 0; } }
  @keyframes particleFloat { 0% { transform: translate(-50%,0) scale(0.6); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx, 0px)), -70px) scale(1.1); opacity: 0; } }

  .confetti-piece {
    position: absolute; top: -6px; width: 7px; height: 11px; opacity: 0.95;
    animation: confettiFall 1.3s ease-in forwards; z-index: 5; pointer-events: none;
    transform: rotate(var(--rot, 0deg));
  }
  @keyframes confettiFall {
    0% { transform: translate(0,0) rotate(var(--rot,0deg)); opacity: 1; }
    100% { transform: translate(var(--drift,0px), 130px) rotate(calc(var(--rot,0deg) + 250deg)); opacity: 0; }
  }

  #bg-dust { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
  .dust-mote { position: absolute; border-radius: 50%; background: var(--accent); opacity: 0.08; filter: blur(1px); animation: dustDrift linear infinite; }
  @keyframes dustDrift {
    0% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-30px) translateX(12px); }
    100% { transform: translateY(0) translateX(0); }
  }
  #sherry-tongue { transform-origin: 100px 118px; animation: tongueWag 0.5s ease-in-out infinite; }
  #intro-title { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; font-weight: 800; font-size: 1.35rem; letter-spacing: .02em; color: var(--fg); max-width: 320px; text-align: center; }
  #intro-title span { display: inline-block; opacity: 0; animation: letterPop .4s ease forwards; }
  #intro-sub { margin-top: 10px; color: var(--accent); font-weight: 700; font-size: 0.85rem; letter-spacing: .12em; opacity: 0; animation: fadeInUp .5s ease forwards; animation-delay: .9s; }
  #intro-hint { margin-top: 14px; color: var(--muted); font-size: 0.8rem; opacity: 0; animation: fadeInUp .5s ease forwards, hintPulse 1.6s ease-in-out infinite; animation-delay: 1.5s, 1.5s; }
  #sherry-count { margin-top: 10px; color: var(--muted); font-size: 0.72rem; opacity: 0; animation: fadeInUp .5s ease forwards; animation-delay: 1.9s; }
  @keyframes hintPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes introBounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
  @keyframes letterPop { 0% { opacity: 0; transform: translateY(14px) scale(0.6); } 60% { opacity: 1; transform: translateY(-3px) scale(1.08); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes sherryIdle { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-4px) rotate(-1.5deg); } }
  @keyframes sherryWiggle { 0%, 100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-8deg) scale(1.05); } 75% { transform: rotate(8deg) scale(1.05); } }
  @keyframes tongueWag { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

  .side-ad {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 190px; padding: 22px 16px; background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 16px; text-align: center; z-index: 400; box-shadow: 0 8px 22px rgba(0,0,0,.25);
    animation: fadeInUp .5s ease both;
  }
  .side-ad-left { left: 18px; }
  .side-ad-right { right: 18px; }
  .side-ad .ad-emoji { font-size: 3.4rem; display: block; margin-bottom: 10px; }
  .side-ad .ad-title { font-size: 1rem; font-weight: 800; color: var(--fg); line-height: 1.25; }
  .side-ad .ad-sub { font-size: 0.8rem; color: var(--muted); margin-top: 6px; line-height: 1.3; }
  @media (max-width: 1300px) { .side-ad { display: none; } }
  .ad-spin .ad-emoji { animation: adSpin 2.5s linear infinite; }
  .ad-flash { animation: adFlash 1s steps(1) infinite; }
  .ad-pulse .ad-emoji { animation: adPulse 1.1s ease-in-out infinite; }
  .ad-wave .ad-emoji { animation: adWave 1.8s ease-in-out infinite; }
  .ad-smoke .ad-emoji { animation: adSmoke 2.2s ease-in-out infinite; }
  .ad-hearts .ad-emoji { animation: adHearts 1.3s ease-in-out infinite; }
  .ad-bounce .ad-emoji { animation: adBounce 1s ease-in-out infinite; }
  .ad-wobble .ad-emoji { animation: adWobble 1.6s ease-in-out infinite; }
  .ad-shimmer .ad-emoji { animation: adShimmer 1.4s ease-in-out infinite; }
  @keyframes adSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes adFlash { 0%, 49% { filter: brightness(1); } 50%, 100% { filter: brightness(1.6) saturate(1.4); } }
  @keyframes adPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes adWave { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes adSmoke { 0% { transform: translateY(0) scale(1); opacity: 1; } 50% { transform: translateY(-6px) scale(1.08); opacity: .7; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes adHearts { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.15); } }
  @keyframes adBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes adWobble { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes adShimmer { 0%, 100% { filter: brightness(1) drop-shadow(0 0 0 transparent); transform: scale(1); } 50% { filter: brightness(1.35) drop-shadow(0 0 6px gold); transform: scale(1.1); } }
</style>

    if (!audioCtx) return;
    try {

      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, audioCtx.currentTime + start);
      gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + start);
      osc.stop(audioCtx.currentTime + start + dur + 0.05);
    } catch (e) {}
  }

  function ensureMasterGain() {
    unlockAudio();

    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!masterGain) {
      masterGain = audioCtx.createGain();

  function playChordStep() {
    if (!ambientPlaying || !audioCtx) return;
    const mood = AMBIENT_MOODS[ambientIndex];
    const chord = mood.chords[chordStep % mood.chords.length];
    chordStep++;
    const now = audioCtx.currentTime;
    const dur = mood.chordDur;
    chord.forEach((freq) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = mood.wave;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.05, now + 0.06);
      gain.gain.linearRampToValueAtTime(0.05, now + dur - 0.3);
      gain.gain.linearRampToValueAtTime(0, now + dur);
      osc.connect(gain).connect(masterGain);
      osc.start(now);
      osc.stop(now + dur + 0.05);
    });
    if (mood.arpeggio) {
      chord.forEach((freq, i) => {
        const t = now + (i * dur) / (chord.length * 1.4);
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.value = freq * 2;
        gain2.gain.setValueAtTime(0, t);
        gain2.gain.linearRampToValueAtTime(0.045, t + 0.02);
        gain2.gain.exponentialRampToValueAtTime(0.0008, t + 0.6);
        osc2.connect(gain2).connect(masterGain);
        osc2.start(t);
        osc2.stop(t + 0.65);
      });
    }
    ambientTimer = setTimeout(playChordStep, dur * 1000 - 250);
  }

  function fmtWhen(dateStr, timeStr) {
    if (!dateStr) return 'Sin fecha';
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, (m || 1) - 1, d || 1);
    const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    let s = dias[dt.getDay()] + ' ' + dt.getDate() + ' ' + meses[dt.getMonth()];
    if (timeStr) s += ' · ' + timeStr;
    return s;
  }

  function relTag(dateStr) {
    if (!dateStr) return '';
    const today = new Date(); today.setHours(0,0,0,0);
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, (m || 1) - 1, d || 1);
    const diff = Math.round((dt - today) / 86400000);
    if (diff === 0) return 'HOY';
    if (diff === 1) return 'MAÑANA';
    if (diff < 0) return 'PASADA';
    return '';
  }

  }
  const FLAG_TARGETS = new Set(['papa', 'mania', 'themania', 'xian', 'tmania']);

    const rel = relTag(s.date);

    left.appendChild(when);

    const filled = s.teams ? ((s.teamA || []).length + (s.teamB || []).length) : (s.players || []).length;
    const cap = document.createElement('div');
    cap.className = 'capacity';
    cap.innerHTML = filled >= s.capacity ? '<span class="full-tag">COMPLETO</span>' : (filled + '/' + s.capacity);
    top.appendChild(cap);
    el.appendChild(top);

    if (s.deleteAt) {
      const countdown = document.createElement('div');
      countdown.style.cssText = 'font-size:0.72rem;color:var(--muted);margin:-4px 0 10px;';
      countdown.textContent = fmtCountdown(s.date ? computeDeleteAt(s.date, s.time) : s.deleteAt);
      el.appendChild(countdown);
    }

    if (s.teams) {
      const teams = document.createElement('div');
      teams.className = 'teams';
      const colA = document.createElement('div');
      const labelA = document.createElement('div');
      labelA.className = 'team-label a';
      labelA.textContent = 'Equipo A';
      colA.appendChild(labelA);
      colA.appendChild(renderRoster(docId, 'teamA', s.teamA || [], 5, s));
      const colB = document.createElement('div');
      const labelB = document.createElement('div');
      labelB.className = 'team-label b';
      labelB.textContent = 'Equipo B';
      colB.appendChild(labelB);
      colB.appendChild(renderRoster(docId, 'teamB', s.teamB || [], 5, s));
      teams.appendChild(colA);
      teams.appendChild(colB);
      el.appendChild(teams);
    } else {
      el.appendChild(renderRoster(docId, 'players', s.players || [], s.capacity, s));
    }

    el.appendChild(renderWaitlist(docId, s));

    const footer = document.createElement('div');
    footer.className = 'session-footer';
    const creator = document.createElement('span');
    creator.className = 'creator-note';
    creator.textContent = s.creator ? ('Creada por ' + s.creator) : '';
    footer.appendChild(creator);
    el.appendChild(footer);

    return el;
  }

  // ---------- Fecha de borrado / cuenta atrás ----------
  function computeDeleteAt(date, time) {
    const [y, m, d] = date.split('-').map(Number);
    const [hh, mm] = (time || '00:00').split(':').map(Number);
    const sessionDate = new Date(y, (m || 1) - 1, d || 1, hh || 0, mm || 0);
    const deleteDate = new Date(sessionDate.getTime() + 1 * 60 * 60 * 1000);
    return firebase.firestore.Timestamp.fromDate(deleteDate);
  }

  function fmtCountdown(deleteAt) {
    if (!deleteAt || !deleteAt.toDate) return '';
    const ms = deleteAt.toDate().getTime() - Date.now();
    if (ms <= 0) return 'Borrando…';
    const totalMin = Math.floor(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    if (h > 0) return 'Se borra en ' + h + 'h ' + m + 'm';
    return 'Se borra en ' + m + 'm';
  }

  // ---------- Acciones ----------
  function createSession() {
    const date = document.getElementById('f-date').value;
    const time = document.getElementById('f-time').value;
    const type = document.getElementById('f-type').value;
    const note = document.getElementById('f-note').value.trim();
    const creator = getMyName();
    if (!date) { alert('Elige una fecha.'); return; }
    if (!time) { alert('Elige una hora.'); return; }

    const info = TYPE_INFO[type];
    const deleteAt = computeDeleteAt(date, time);
    if (deleteAt.toDate().getTime() <= Date.now()) {
      alert('Esa fecha/hora ya ha pasado (o pasará en menos de 1h), así que la sesión se borraría nada más crearla. Elige una fecha/hora futura.');
      return;
    }
    const session = {
      date, time, type, game: info.game, capacity: info.capacity, teams: info.teams,
      note, creator, createdAt: Date.now(), deleteAt, waitlist: []
    };
    if (info.teams) { session.teamA = []; session.teamB = []; } else { session.players = []; }

    sessionsRef.add(session).then(() => {
      document.getElementById('f-note').value = '';
    }).catch(() => showBanner('No se ha podido crear la sesión. Revisa la conexión con la base de datos.'));
  }

  function joinSession(docId, teamKey, roster, capacity) {
    const name = getMyName();
    if (!name) { alert('Escribe tu nombre arriba antes de apuntarte.'); return; }
    if (roster.length >= capacity) { alert('Ese hueco ya está completo.'); return; }
    const myUid = getMyUid();
    if (roster.some((e) => normalize(e).uid === myUid)) { alert('Ya estás apuntado ahí.'); return; }
    sessionsRef.doc(docId).update({
      [teamKey]: firebase.firestore.FieldValue.arrayUnion({ name, uid: myUid })
    }).then(() => {
      if (teamKey === 'waitlist') playWaitlistSound(); else playJoinSound();
    }).catch(() => showBanner('No se ha podido guardar. Inténtalo de nuevo.'));
  }

  function leaveSession(docId, teamKey, entry) {
    sessionsRef.doc(docId).update({
      [teamKey]: firebase.firestore.FieldValue.arrayRemove(entry)
    }).catch(() => showBanner('No se ha podido guardar. Inténtalo de nuevo.'));
  }

  document.getElementById('f-type').addEventListener('change', () => {}); // reservado por si se necesita en el futuro
  document.getElementById('btn-create').addEventListener('click', createSession);

  const createToggle = document.getElementById('create-toggle');
  const createBody = document.getElementById('create-body');
  const createChevron = document.getElementById('create-chevron');
  createToggle.addEventListener('click', () => {
    createBody.classList.toggle('open');
    createChevron.classList.toggle('open');
  });

  const savedName = localStorage.getItem('cs-squad-name');
  if (savedName) document.getElementById('my-name').value = savedName;
  document.getElementById('my-name').addEventListener('input', () => renderList());
  document.getElementById('my-name').addEventListener('change', (e) => {
    try { localStorage.setItem('cs-squad-name', e.target.value.trim()); } catch (err) {}
  });

  // ---------- Lista en vivo ----------
  let latestDocs = [];
  const wasFullMap = new Map();
  let firstRender = true;

  function isFull(s) {
    const filled = s.teams ? ((s.teamA || []).length + (s.teamB || []).length) : (s.players || []).length;
    return filled >= s.capacity;
  }

  const CONFETTI_COLORS = ['#ff8a3d', '#3ad672', '#6ea8ff', '#ff8080', '#ffd166'];
  function launchConfetti(cardEl) {
    for (let i = 0; i < 26; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.style.left = (10 + Math.random() * 80) + '%';
      piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      piece.style.animationDelay = (Math.random() * 0.25) + 's';
      piece.style.setProperty('--rot', (Math.random() * 360) + 'deg');
      piece.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
      cardEl.appendChild(piece);
      setTimeout(() => piece.remove(), 1500);
    }
  }

  function renderList() {
    const list = document.getElementById('sessions-list');
    list.innerHTML = '';
    const now = Date.now();
    const visible = latestDocs.filter((d) => {
      const freshMs = d.data.date ? computeDeleteAt(d.data.date, d.data.time).toDate().getTime() : 0;
      const expired = freshMs <= now;
      if (expired) {
        const storedMs = (d.data.deleteAt && d.data.deleteAt.toDate) ? d.data.deleteAt.toDate().getTime() : 0;
        if (storedMs > now) {
          sessionsRef.doc(d.id).update({ deleteAt: firebase.firestore.Timestamp.fromDate(new Date(freshMs)) })
            .then(() => sessionsRef.doc(d.id).delete())
            .catch(() => {});
        } else {
          sessionsRef.doc(d.id).delete().catch(() => {});
        }
      }
      return !expired;
    });
    if (!visible.length) {
      list.innerHTML = '<div class="empty-msg">Todavía no hay sesiones. ¡Crea la primera!</div>';
      firstRender = false;
      renderSummary([]);
      return;
    }
    visible.forEach((d) => {
      const el = renderSession(d.id, d.data);
      const nowFull = isFull(d.data);
      const wasFull = wasFullMap.get(d.id) || false;
      if (nowFull && !wasFull && !firstRender) {
        el.classList.add('just-completed');
        playCompleteSound();
        setTimeout(() => el.classList.remove('just-completed'), 1200);
        list.appendChild(el);
        launchConfetti(el);
        wasFullMap.set(d.id, nowFull);
        return;
      }
      wasFullMap.set(d.id, nowFull);
      list.appendChild(el);
    });
    firstRender = false;
    renderSummary(visible);
  }

  function renderSummary(visible) {
    const bar = document.getElementById('summary-bar');
    bar.innerHTML = '';
    const openMain = visible.filter((d) => !isFull(d.data)).length;
    const openWait = visible.filter((d) => (d.data.waitlist || []).length < WAITLIST_CAP).length;
    const otherGames = [...new Set(
      visible.filter((d) => d.data.game && d.data.game !== 'CS2').map((d) => d.data.game)
    )];

    if (openMain > 0) {
      const p = document.createElement('span');
      p.className = 'pill';
      p.textContent = '🟢 ' + openMain + (openMain === 1 ? ' premade con hueco' : ' premades con hueco');
      bar.appendChild(p);
    }
    if (openWait > 0) {
      const p = document.createElement('span');
      p.className = 'pill';
      p.textContent = '🕓 ' + openWait + (openWait === 1 ? ' con hueco de suplente' : ' con hueco de suplente');
      bar.appendChild(p);
    }
    if (otherGames.length) {
      const p = document.createElement('span');
      p.className = 'pill pill-accent';
      const texto = otherGames.length === 1
        ? 'Hay una propuesta de ' + otherGames[0]
        : 'Hay propuestas de ' + otherGames.join(' y ');
      p.textContent = '🎲 ' + texto;
      bar.appendChild(p);
    }
  }

  setInterval(renderList, 60000);

  sessionsRef.onSnapshot((snap) => {
    latestDocs = [];
    snap.forEach((doc) => latestDocs.push({ id: doc.id, data: doc.data() }));
    latestDocs.sort((a, b) => {
      const ak = (a.data.date || '9999') + 'T' + (a.data.time || '99:99');
      const bk = (b.data.date || '9999') + 'T' + (b.data.time || '99:99');
      return ak < bk ? -1 : ak > bk ? 1 : 0;
    });
    renderList();
  }, (err) => {
    showBanner('No se ha podido conectar con la base de datos. Revisa que la configuración de Firebase esté bien pegada y que Firestore esté activado.');
    console.error(err);
  });
})();
</script>
</body>
</html>
