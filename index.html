<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Squad — Reservas</title>
<style>
  :root {
    --bg: #14161a;
    --bg-elev: #1d2026;
    --fg: #eef0f3;
    --muted: #9aa0ab;
    --border: #30343c;
    --accent: #ff8a3d;
    --accent-fg: #1a1200;
    --accent-soft: #3a2712;
    --danger: #ff6b6b;
    --success: #3ad672;
    --success-soft: #123a22;
    --slotA: #6ea8ff;
    --slotB: #ff8080;
    --chip-bg: #262a31;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7;
    --bg-elev: #ffffff;
    --fg: #1b1e24;
    --muted: #6b7280;
    --border: #e2e4e9;
    --accent: #f5761a;
    --accent-fg: #ffffff;
    --accent-soft: #fef1e6;
    --danger: #d64545;
    --success: #1f9d52;
    --success-soft: #e6f8ed;
    --slotA: #3a7bd5;
    --slotB: #d5473a;
    --chip-bg: #eef0f3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); padding: 20px 14px 60px; line-height: 1.4; transition: background .25s, color .25s; }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; position: relative; animation: fadeInUp .5s ease both; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: 0.95rem; }
  #theme-toggle {
    position: absolute; top: 0; right: 0;
    background: var(--chip-bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 999px; width: 38px; height: 38px; padding: 0; font-size: 1.1rem;
  }
  #banner { display: none; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--fg); padding: 10px 14px; border-radius: 14px; margin-bottom: 16px; font-size: 0.9rem; }
  .card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; animation: fadeInUp .5s ease both; }
  .card:nth-of-type(2) { animation-delay: .05s; }
  .card:nth-of-type(3) { animation-delay: .1s; }
  .card h2 { margin: 0 0 14px; font-size: 1.05rem; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }
  input, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.95rem; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }
  button { cursor: pointer; border: none; border-radius: 10px; padding: 10px 16px; font-size: 0.9rem; font-weight: 600; background: var(--accent); color: var(--accent-fg); transition: transform .1s; }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.small { padding: 5px 10px; font-size: 0.78rem; }
  button.full { width: 100%; margin-top: 16px; }
  button.subtle { background: var(--chip-bg); color: var(--fg); }
  #sessions-list { display: flex; flex-direction: column; gap: 14px; }
  .empty-msg { color: var(--muted); text-align: center; padding: 20px 0; font-size: 0.9rem; }
  .session-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 14px; padding: 16px; animation: fadeInUp .4s ease both; transition: box-shadow .3s, border-color .3s; }
  .session-card.just-completed { animation: fadeInUp .4s ease both, celebrate 1.1s ease; border-color: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
  .session-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .session-when { font-weight: 700; font-size: 1rem; }
  .session-when .rel { color: var(--accent); font-weight: 600; font-size: 0.8rem; margin-left: 6px; }
  .badge { display: inline-block; background: var(--chip-bg); color: var(--fg); border-radius: 999px; padding: 3px 10px; font-size: 0.75rem; font-weight: 600; margin-top: 4px; }
  .capacity { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .teams { display: flex; gap: 12px; }
  .teams > div { flex: 1; min-width: 0; }
  .team-label { font-size: 0.78rem; font-weight: 700; margin-bottom: 6px; }
  .team-label.a { color: var(--slotA); }
  .team-label.b { color: var(--slotB); }
  .players { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { background: var(--chip-bg); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 0.82rem; display: flex; align-items: center; gap: 6px; animation: chipPop .28s ease; }
  .chip button { background: transparent; color: var(--muted); padding: 0 4px; font-size: 0.9rem; font-weight: 700; border-radius: 50%; line-height: 1; }
  .chip button:hover { color: var(--danger); }
  .slot-empty { border: 1px dashed var(--border); border-radius: 999px; padding: 4px 12px; font-size: 0.82rem; color: var(--muted); }
  .join-row { display: flex; gap: 8px; margin-top: 8px; }
  .waitlist-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .waitlist-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  .session-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .creator-note { font-size: 0.75rem; color: var(--muted); }
  .full-tag { color: var(--danger); font-weight: 700; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes chipPop { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes celebrate { 0% { transform: scale(1); } 20% { transform: scale(1.015); } 40% { transform: scale(0.995); } 60% { transform: scale(1.01); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="theme-toggle" title="Cambiar tema">🌙</button>
    <h1>🎮 CS Squad — Reservas</h1>
    <p>Apúntate, monta una premade o propón partidas con la peña del Discord</p>
  </header>

  <div id="banner"></div>

  <div class="card">
    <h2>Tu nombre</h2>
    <input id="my-name" type="text" placeholder="Como te llaman en el Discord" maxlength="24">
    <p style="font-size:0.78rem;color:var(--muted);margin:6px 0 0;">Se guarda solo en este dispositivo.</p>
  </div>

  <div class="card">
    <h2>Crear nueva sesión</h2>
    <div class="row">
      <div><label for="f-date">Fecha</label><input id="f-date" type="date"></div>
      <div><label for="f-time">Hora</label><input id="f-time" type="time"></div>
    </div>
    <label for="f-type">Tipo</label>
    <select id="f-type">
      <option value="premadeA">🔫 Premade A (CS2, 5)</option>
      <option value="premadeB">🔫 Premade B (CS2, 5)</option>
      <option value="fivevfive">🔫 5 vs 5 interno (CS2, 10)</option>
      <option value="pummel">🥊 Pummel Party (10)</option>
      <option value="picopark">🧩 Pico Park (10)</option>
    </select>
    <label for="f-note">Nota (opcional)</label>
    <input id="f-note" type="text" placeholder="Ej: ranked, solo pistoleo, etc." maxlength="80">
    <button class="full" id="btn-create">Crear sesión</button>
  </div>

  <div class="card">
    <h2>Sesiones programadas</h2>
    <div id="sessions-list"></div>
  </div>
</div>

<!-- ====== FIREBASE ====== -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC6A3WQI6t7BXZs7AaNMgsCsWj6BlLkXFg",
    authDomain: "premades-cs.firebaseapp.com",
    projectId: "premades-cs",
    storageBucket: "premades-cs.firebasestorage.app",
    messagingSenderId: "456607392937",
    appId: "1:456607392937:web:e2f97f610ed89d0deab5b8"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const sessionsRef = db.collection('sessions');
</script>

<script>
(function () {
  const WAITLIST_CAP = 2;

  const TYPE_INFO = {
    premadeA:  { game: 'CS2', label: 'Premade A', icon: '🔫', capacity: 5,  teams: false },
    premadeB:  { game: 'CS2', label: 'Premade B', icon: '🔫', capacity: 5,  teams: false },
    fivevfive: { game: 'CS2', label: '5 vs 5',     icon: '🔫', capacity: 10, teams: true  },
    pummel:    { game: 'Pummel Party', label: '',  icon: '🥊', capacity: 10, teams: false },
    picopark:  { game: 'Pico Park',    label: '',  icon: '🧩', capacity: 10, teams: false },
  };

  // ---------- Tema ----------
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme-toggle');
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'light' ? '☀️' : '🌙';
  }
  applyTheme(localStorage.getItem('cs-squad-theme') || 'dark');
  themeBtn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('cs-squad-theme', next); } catch (e) {}
  });

  // ---------- Sonidos ----------
  let audioCtx = null;
  function unlockAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
  }
  ['click', 'keydown', 'touchstart'].forEach((ev) => document.addEventListener(ev, unlockAudio, { once: true }));

  function playTone(freq, start, dur, vol) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, audioCtx.currentTime + start);
      gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + start);
      osc.stop(audioCtx.currentTime + start + dur + 0.05);
    } catch (e) {}
  }
  function playJoinSound() { playTone(720, 0, 0.12, 0.08); }
  function playCompleteSound() {
    playTone(523, 0, 0.14, 0.09);
    playTone(659, 0.12, 0.14, 0.09);
    playTone(784, 0.24, 0.22, 0.1);
  }

  // ---------- Utilidades ----------
  function showBanner(msg) {
    const b = document.getElementById('banner');
    b.textContent = msg;
    b.style.display = 'block';
  }

  function getMyName() { return document.getElementById('my-name').value.trim(); }

  function getMyUid() {
    let uid = localStorage.getItem('cs-squad-uid');
    if (!uid) {
      uid = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
      try { localStorage.setItem('cs-squad-uid', uid); } catch (err) {}
    }
    return uid;
  }

  function fmtWhen(dateStr, timeStr) {
    if (!dateStr) return 'Sin fecha';
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, (m || 1) - 1, d || 1);
    const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    let s = dias[dt.getDay()] + ' ' + dt.getDate() + ' ' + meses[dt.getMonth()];
    if (timeStr) s += ' · ' + timeStr;
    return s;
  }

  function relTag(dateStr) {
    if (!dateStr) return '';
    const today = new Date(); today.setHours(0,0,0,0);
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, (m || 1) - 1, d || 1);
    const diff = Math.round((dt - today) / 86400000);
    if (diff === 0) return 'HOY';
    if (diff === 1) return 'MAÑANA';
    if (diff < 0) return 'PASADA';
    return '';
  }

  function normalize(entry) { return (typeof entry === 'string') ? { name: entry, uid: null } : entry; }

  function isUserInSession(s) {
    const uid = getMyUid();
    const pools = [s.players || [], s.teamA || [], s.teamB || [], s.waitlist || []];
    return pools.some((pool) => pool.some((e) => normalize(e).uid === uid));
  }

  // ---------- Render de jugadores ----------
  function renderChip(docId, teamKey, rawEntry) {
    const entry = normalize(rawEntry);
    const chip = document.createElement('span');
    chip.className = 'chip';
    const span = document.createElement('span');
    span.textContent = entry.name;
    chip.appendChild(span);
    if (entry.uid === getMyUid()) {
      const btn = document.createElement('button');
      btn.textContent = '×';
      btn.title = 'Salir';
      btn.addEventListener('click', () => leaveSession(docId, teamKey, rawEntry));
      chip.appendChild(btn);
    }
    return chip;
  }

  function renderRoster(docId, teamKey, roster, capacity, s) {
    const box = document.createElement('div');
    const playersDiv = document.createElement('div');
    playersDiv.className = 'players';
    roster.forEach((entry) => playersDiv.appendChild(renderChip(docId, teamKey, entry)));
    for (let i = roster.length; i < capacity; i++) {
      const slot = document.createElement('span');
      slot.className = 'slot-empty';
      slot.textContent = 'libre';
      playersDiv.appendChild(slot);
    }
    box.appendChild(playersDiv);
    if (roster.length < capacity && !isUserInSession(s)) {
      const joinRow = document.createElement('div');
      joinRow.className = 'join-row';
      const btn = document.createElement('button');
      btn.className = 'small';
      btn.textContent = 'Unirme';
      btn.addEventListener('click', () => joinSession(docId, teamKey, roster, capacity, s));
      joinRow.appendChild(btn);
      box.appendChild(joinRow);
    }
    return box;
  }

  function renderWaitlist(docId, s) {
    const waitlist = s.waitlist || [];
    const box = document.createElement('div');
    box.className = 'waitlist-box';
    const label = document.createElement('div');
    label.className = 'waitlist-label';
    label.textContent = 'Suplentes (' + waitlist.length + '/' + WAITLIST_CAP + ')';
    box.appendChild(label);
    const row = document.createElement('div');
    row.className = 'players';
    waitlist.forEach((entry) => row.appendChild(renderChip(docId, 'waitlist', entry)));
    for (let i = waitlist.length; i < WAITLIST_CAP; i++) {
      const slot = document.createElement('span');
      slot.className = 'slot-empty';
      slot.textContent = 'libre';
      row.appendChild(slot);
    }
    box.appendChild(row);
    if (waitlist.length < WAITLIST_CAP && !isUserInSession(s)) {
      const joinRow = document.createElement('div');
      joinRow.className = 'join-row';
      const btn = document.createElement('button');
      btn.className = 'small subtle';
      btn.textContent = 'Apuntarme de suplente';
      btn.addEventListener('click', () => joinSession(docId, 'waitlist', waitlist, WAITLIST_CAP, s));
      joinRow.appendChild(btn);
      box.appendChild(joinRow);
    }
    return box;
  }

  // ---------- Render de sesión ----------
  function renderSession(docId, s) {
    const info = TYPE_INFO[s.type] || { game: s.game, label: '', icon: '🎲', capacity: s.capacity, teams: false };
    const el = document.createElement('div');
    el.className = 'session-card';
    el.dataset.id = docId;

    const top = document.createElement('div');
    top.className = 'session-top';
    const left = document.createElement('div');
    const when = document.createElement('div');
    when.className = 'session-when';
    when.textContent = fmtWhen(s.date, s.time);
    const rel = relTag(s.date);
    if (rel) { const r = document.createElement('span'); r.className = 'rel'; r.textContent = rel; when.appendChild(r); }
    left.appendChild(when);
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = info.icon + ' ' + info.game + (info.label ? ' · ' + info.label : '');
    left.appendChild(badge);
    if (s.note) {
      const note = document.createElement('div');
      note.style.cssText = 'font-size:0.8rem;color:var(--muted);margin-top:4px;';
      note.textContent = s.note;
      left.appendChild(note);
    }
    top.appendChild(left);

    const filled = s.teams ? ((s.teamA || []).length + (s.teamB || []).length) : (s.players || []).length;
    const cap = document.createElement('div');
    cap.className = 'capacity';
    cap.innerHTML = filled >= s.capacity ? '<span class="full-tag">COMPLETO</span>' : (filled + '/' + s.capacity);
    top.appendChild(cap);
    el.appendChild(top);

    if (s.deleteAt) {
      const countdown = document.createElement('div');
      countdown.style.cssText = 'font-size:0.72rem;color:var(--muted);margin:-4px 0 10px;';
      countdown.textContent = fmtCountdown(s.deleteAt);
      el.appendChild(countdown);
    }

    if (s.teams) {
      const teams = document.createElement('div');
      teams.className = 'teams';
      const colA = document.createElement('div');
      const labelA = document.createElement('div');
      labelA.className = 'team-label a';
      labelA.textContent = 'Equipo A';
      colA.appendChild(labelA);
      colA.appendChild(renderRoster(docId, 'teamA', s.teamA || [], 5, s));
      const colB = document.createElement('div');
      const labelB = document.createElement('div');
      labelB.className = 'team-label b';
      labelB.textContent = 'Equipo B';
      colB.appendChild(labelB);
      colB.appendChild(renderRoster(docId, 'teamB', s.teamB || [], 5, s));
      teams.appendChild(colA);
      teams.appendChild(colB);
      el.appendChild(teams);
    } else {
      el.appendChild(renderRoster(docId, 'players', s.players || [], s.capacity, s));
    }

    el.appendChild(renderWaitlist(docId, s));

    const footer = document.createElement('div');
    footer.className = 'session-footer';
    const creator = document.createElement('span');
    creator.className = 'creator-note';
    creator.textContent = s.creator ? ('Creada por ' + s.creator) : '';
    footer.appendChild(creator);
    el.appendChild(footer);

    return el;
  }

  // ---------- Fecha de borrado / cuenta atrás ----------
  function computeDeleteAt(date, time) {
    const [y, m, d] = date.split('-').map(Number);
    const [hh, mm] = (time || '00:00').split(':').map(Number);
    const sessionDate = new Date(y, (m || 1) - 1, d || 1, hh || 0, mm || 0);
    const deleteDate = new Date(sessionDate.getTime() + 24 * 60 * 60 * 1000);
    return firebase.firestore.Timestamp.fromDate(deleteDate);
  }

  function fmtCountdown(deleteAt) {
    if (!deleteAt || !deleteAt.toDate) return '';
    const ms = deleteAt.toDate().getTime() - Date.now();
    if (ms <= 0) return 'Borrando…';
    const totalMin = Math.floor(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    if (h >= 24) {
      const d = Math.floor(h / 24);
      return 'Se borra en ' + d + (d === 1 ? ' día' : ' días');
    }
    if (h > 0) return 'Se borra en ' + h + 'h ' + m + 'm';
    return 'Se borra en ' + m + 'm';
  }

  // ---------- Acciones ----------
  function createSession() {
    const date = document.getElementById('f-date').value;
    const time = document.getElementById('f-time').value;
    const type = document.getElementById('f-type').value;
    const note = document.getElementById('f-note').value.trim();
    const creator = getMyName();
    if (!date) { alert('Elige una fecha.'); return; }

    const info = TYPE_INFO[type];
    const deleteAt = computeDeleteAt(date, time);
    const session = {
      date, time, type, game: info.game, capacity: info.capacity, teams: info.teams,
      note, creator, createdAt: Date.now(), deleteAt, waitlist: []
    };
    if (info.teams) { session.teamA = []; session.teamB = []; } else { session.players = []; }

    sessionsRef.add(session).then(() => {
      document.getElementById('f-note').value = '';
    }).catch(() => showBanner('No se ha podido crear la sesión. Revisa la conexión con la base de datos.'));
  }

  function joinSession(docId, teamKey, roster, capacity) {
    const name = getMyName();
    if (!name) { alert('Escribe tu nombre arriba antes de apuntarte.'); return; }
    if (roster.length >= capacity) { alert('Ese hueco ya está completo.'); return; }
    const myUid = getMyUid();
    if (roster.some((e) => normalize(e).uid === myUid)) { alert('Ya estás apuntado ahí.'); return; }
    sessionsRef.doc(docId).update({
      [teamKey]: firebase.firestore.FieldValue.arrayUnion({ name, uid: myUid })
    }).then(() => {
      playJoinSound();
    }).catch(() => showBanner('No se ha podido guardar. Inténtalo de nuevo.'));
  }

  function leaveSession(docId, teamKey, entry) {
    sessionsRef.doc(docId).update({
      [teamKey]: firebase.firestore.FieldValue.arrayRemove(entry)
    }).catch(() => showBanner('No se ha podido guardar. Inténtalo de nuevo.'));
  }

  document.getElementById('f-type').addEventListener('change', () => {}); // reservado por si se necesita en el futuro
  document.getElementById('btn-create').addEventListener('click', createSession);

  const savedName = localStorage.getItem('cs-squad-name');
  if (savedName) document.getElementById('my-name').value = savedName;
  document.getElementById('my-name').addEventListener('input', () => renderList());
  document.getElementById('my-name').addEventListener('change', (e) => {
    try { localStorage.setItem('cs-squad-name', e.target.value.trim()); } catch (err) {}
  });

  // ---------- Lista en vivo ----------
  let latestDocs = [];
  const wasFullMap = new Map();
  let firstRender = true;

  function isFull(s) {
    const filled = s.teams ? ((s.teamA || []).length + (s.teamB || []).length) : (s.players || []).length;
    return filled >= s.capacity;
  }

  function renderList() {
    const list = document.getElementById('sessions-list');
    list.innerHTML = '';
    const now = Date.now();
    const visible = latestDocs.filter((d) => {
      const expired = d.data.deleteAt && d.data.deleteAt.toDate().getTime() <= now;
      if (expired) {
        sessionsRef.doc(d.id).delete().catch(() => {});
      }
      return !expired;
    });
    if (!visible.length) {
      list.innerHTML = '<div class="empty-msg">Todavía no hay sesiones. ¡Crea la primera!</div>';
      firstRender = false;
      return;
    }
    visible.forEach((d) => {
      const el = renderSession(d.id, d.data);
      const nowFull = isFull(d.data);
      const wasFull = wasFullMap.get(d.id) || false;
      if (nowFull && !wasFull && !firstRender) {
        el.classList.add('just-completed');
        playCompleteSound();
        setTimeout(() => el.classList.remove('just-completed'), 1200);
      }
      wasFullMap.set(d.id, nowFull);
      list.appendChild(el);
    });
    firstRender = false;
  }

  setInterval(renderList, 60000);

  sessionsRef.onSnapshot((snap) => {
    latestDocs = [];
    snap.forEach((doc) => latestDocs.push({ id: doc.id, data: doc.data() }));
    latestDocs.sort((a, b) => {
      const ak = (a.data.date || '9999') + 'T' + (a.data.time || '99:99');
      const bk = (b.data.date || '9999') + 'T' + (b.data.time || '99:99');
      return ak < bk ? -1 : ak > bk ? 1 : 0;
    });
    renderList();
  }, (err) => {
    showBanner('No se ha podido conectar con la base de datos. Revisa que la configuración de Firebase esté bien pegada y que Firestore esté activado.');
    console.error(err);
  });
})();
</script>
</body>
</html>
